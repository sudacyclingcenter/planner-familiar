<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#F5F2EC;min-height:100vh}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;
  align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px)}
.modal-ov.hidden{display:none}
.modal{background:#fff;border-radius:20px;padding:28px 24px;
  max-width:320px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-center{text-align:center}
.modal-icon{font-size:40px;margin-bottom:6px;display:block;text-align:center}
.modal h2{font-size:21px;font-weight:800;color:#1C1917;margin-bottom:4px;text-align:center}
.modal p{font-size:13px;color:#9CA3AF;margin-bottom:18px;line-height:1.5;text-align:center}
.ubtn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:#fff;
  margin-bottom:8px;transition:transform .1s;display:flex;
  align-items:center;justify-content:center;gap:8px}
.ubtn:last-child{margin-bottom:0}
.ubtn:active{transform:scale(.97)}

/* TASK MODAL EXTRAS */
.tm-label{font-size:12px;font-weight:800;color:#6B7280;text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:7px;margin-top:16px;display:block}
.tm-input{width:100%;border:2px solid #E5E7EB;border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;
  padding:11px 13px;color:#1C1917;outline:none;transition:border-color .2s}
.tm-input:focus{border-color:#1C1917}
.sel-row{display:flex;gap:6px;flex-wrap:wrap}
.sel-btn{flex:1;min-width:60px;padding:9px 6px;border:2px solid #E5E7EB;
  border-radius:10px;font-family:'Nunito',sans-serif;font-size:13px;
  font-weight:700;background:#F9FAFB;color:#6B7280;cursor:pointer;
  transition:all .15s;white-space:nowrap}
.sel-btn.active{border-color:#1C1917;background:#1C1917;color:#fff}
.sel-btn.active.pA{border-color:#2563EB;background:#EFF6FF;color:#2563EB}
.sel-btn.active.pB{border-color:#7C3AED;background:#F5F3FF;color:#7C3AED}
.sel-btn.active.pM{border-color:#1C1917;background:#F4F4F5;color:#1C1917}
.sel-btn.active.pT{border-color:#D97706;background:#FFFBEB;color:#D97706}
.tm-btns{display:flex;gap:8px;margin-top:20px}
.tm-btns .ubtn{margin-bottom:0}

/* HEADER */
.hdr{background:#1C1917;padding:14px 16px 0;position:sticky;top:0;z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hdr-left h1{color:#fff;font-size:18px;font-weight:800;line-height:1}
.hdr-left p{color:#9CA3AF;font-size:11px;margin-top:2px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
  border-radius:20px;padding:5px 11px;cursor:pointer;border:none;
  font-family:'Nunito',sans-serif;transition:background .2s}
.chip:hover{background:rgba(255,255,255,.2)}
.chip span{color:#fff;font-size:12px;font-weight:700}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tb{background:transparent;color:#9CA3AF;border:none;cursor:pointer;
  padding:8px 13px;border-radius:8px 8px 0 0;font-family:'Nunito',sans-serif;
  font-weight:600;font-size:13px;transition:all .2s;white-space:nowrap}
.tb.on{background:#F5F2EC;color:#1C1917;font-weight:800}

/* CONTENT */
.wrap{padding:18px 14px;max-width:680px;margin:0 auto}
.sec{display:none}.sec.on{display:block}

/* DAYS */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.db{background:transparent;border:2px solid transparent;border-radius:12px;
  padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-family:'Nunito',sans-serif;transition:all .2s}
.db.on{background:#fff;border-color:#1C1917}
.dlabel{font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase}
.db.on .dlabel{color:#1C1917}
.rw{position:relative;width:44px;height:44px}
.rw svg{transform:rotate(-90deg);display:block}
.rpct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:10px;font-weight:800;color:#6B7280}
.db.on .rpct{color:#1C1917}
.dsub{font-size:9px;color:#9CA3AF;font-weight:600;min-height:11px;
  text-align:center;line-height:1.2}

/* ALERTS & PROGRESS */
.alert{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:700}
.alert.amber{background:#FEF3C7;border:1px solid #FCD34D;color:#92400E}
.alert.red{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.pcard{background:#fff;border-radius:12px;padding:13px 16px;margin-bottom:14px}
.phdr{display:flex;justify-content:space-between;margin-bottom:7px;
  font-size:13px;font-weight:700;color:#374151}
.ptrack{background:#E5E7EB;border-radius:99px;height:8px}
.pfill{border-radius:99px;height:8px;background:#D97706;transition:width .4s;min-width:0}
.pfill.done{background:#16A34A}

/* TASKS */
.tasks{display:flex;flex-direction:column;gap:7px}
.task{background:#fff;border-radius:10px;padding:11px 13px;display:flex;
  align-items:flex-start;gap:11px;cursor:pointer;transition:opacity .2s;border-left:4px solid}
.task.done{opacity:.6}
.cb{width:22px;height:22px;border-radius:6px;flex-shrink:0;border:2px solid #D1D5DB;
  display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.cb.on{background:#16A34A;border-color:#16A34A}
.ck{color:#fff;font-size:13px;display:none}
.cb.on .ck{display:block}
.tinfo{flex:1;min-width:0}
.tt{font-size:14px;font-weight:600;color:#374151;line-height:1.3}
.task.done .tt{text-decoration:line-through;color:#9CA3AF}
.doneby{font-size:10px;font-weight:700;margin-top:2px}
.star{color:#EF4444;font-size:14px;flex-shrink:0;margin-top:1px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
  flex-shrink:0;margin-top:1px}
.task.done .badge{background:#F3F4F6!important;color:#9CA3AF!important}
.prio-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;
  display:inline-block;margin-top:3px}
.del-btn{background:none;border:none;cursor:pointer;font-size:15px;
  opacity:.35;padding:2px 4px;flex-shrink:0;transition:opacity .15s;margin-top:0px}
.del-btn:hover{opacity:.8}
.add-task-btn{width:100%;margin-top:10px;padding:11px;border:2px dashed #D1D5DB;
  border-radius:10px;background:transparent;font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:700;color:#9CA3AF;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-task-btn:hover{border-color:#1C1917;color:#1C1917;background:#fff}
.custom-section-label{font-size:11px;font-weight:800;color:#9CA3AF;
  text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px;
  display:flex;align-items:center;gap:6px}
.custom-section-label::after{content:'';flex:1;height:1px;background:#E5E7EB}

/* LEGEND */
.leg{margin-top:16px;background:#fff;border-radius:12px;padding:12px 16px}
.legt{font-size:11px;color:#9CA3AF;font-weight:700;margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.8px}
.legr{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

/* MENU */
.mcard{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
.mhdr{background:#1C1917;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.mday{color:#fff;font-weight:800;font-size:14px}
.mnote{font-size:11px;color:#9CA3AF;font-weight:600}
.mbody{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mlabel{font-size:12px;font-weight:700;color:#9CA3AF;min-width:85px;padding-top:1px}
.mfood{font-size:13px;font-weight:600;color:#374151;flex:1;line-height:1.4}

/* SHOPPING */
.scat{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.scath{padding:9px 15px;background:#F9FAFB;border-bottom:1px solid #E5E7EB;
  display:flex;align-items:center;gap:8px}
.scatt{font-weight:800;font-size:14px;color:#1C1917}
.scatn{font-size:12px;color:#9CA3AF;font-weight:600}
.sitems{padding:6px}
.sitem{display:flex;align-items:flex-start;gap:10px;padding:8px 9px;
  border-radius:8px;cursor:pointer;transition:background .15s}
.sitem.warn{background:#FFF7ED}
.sitem.got{background:#F0FDF4}
.scb{width:20px;height:20px;border-radius:4px;flex-shrink:0;border:1.5px solid #D1D5DB;
  background:#fff;display:flex;align-items:center;justify-content:center;
  transition:all .2s;margin-top:1px}
.scb.on{background:#16A34A;border-color:#16A34A}
.sinfo{flex:1}
.sitxt{font-size:13px;font-weight:500;color:#374151}
.sitem.warn .sitxt{font-weight:700;color:#92400E}
.sitem.got .sitxt{text-decoration:line-through;color:#6B7280}
.sdoneby{font-size:10px;font-weight:700;margin-top:2px}
.rbtn{width:100%;padding:12px;background:#fff;border:1.5px solid #E5E7EB;
  border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;
  font-size:14px;color:#6B7280;cursor:pointer;margin-top:2px}

/* TIPS */
.tiplist{display:flex;flex-direction:column;gap:11px}
.tip{background:#fff;border-radius:12px;padding:15px 16px;border-left:4px solid}
.tiph{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tipi{font-size:20px}
.tipt{font-weight:800;font-size:15px;color:#1C1917}
.tipd{font-size:13px;font-weight:500;color:#6B7280;line-height:1.65}
</style>
</head>

  {i:'💰',t:'Presupuesto estimado',d:'Para 3 personas activas en Santiago, el presupuesto de alimentación deportiva es de aprox. $270.000–$340.000/mes.',c:'#D97706'},
  {i:'💪',t:'Nutrición deportiva familiar',d:'Apunta a 1.6–2g de proteína por kg de peso corporal al día. Prioriza la ingesta post-entreno en los primeros 30 minutos.',c:'#7C3AED'},
];

// ─── ESTADO ──────────────────────────────────────────────────────
const jsd=new Date().getDay();
let activeTab='semana';
let activeDay=jsd===0?6:jsd-1;
let tasksState={};        // { "di-i": {done:true, by:"Andrea", at:"14:32"} }
let boughtState={};       // { "ci-ii": {done, by, at} }
let customTasksState={};  // { day: { taskId: {text,priority,assignedTo,createdBy,done,by,at} } }
let currentUser=localStorage.getItem('fp-user')||'';
let useFirebase=false;
let db=null;

// New task modal state
let addingForDay=0;
let newPrio='media';
let newAssign='T';

// ─── FIREBASE ────────────────────────────────────────────────────
function initFirebase(){
  if(FB.apiKey==='PEGA-AQUI')return;
  try{
    firebase.initializeApp(FB);
    db=firebase.database();
    useFirebase=true;
    db.ref('planner/tasks').on('value',s=>{
      tasksState=s.val()||{};
      if(activeTab==='semana')renderSemana();
    });
    db.ref('planner/bought').on('value',s=>{
      boughtState=s.val()||{};
      if(activeTab==='compras')renderCompras();
    });
    db.ref('planner/customTasks').on('value',s=>{
      customTasksState=s.val()||{};
      if(activeTab==='semana')renderSemana();
    });
    db.ref('.info/connected').on('value',s=>{
      document.getElementById('cdot').style.background=s.val()?'#22C55E':'#EF4444';
    });
  }catch(e){
    console.warn('Firebase error:',e);
    fallbackLocal();
  }
}

function fallbackLocal(){
  try{const d=localStorage.getItem('fp-tasks');if(d)tasksState=JSON.parse(d);}catch{}
  try{const d=localStorage.getItem('fp-bought');if(d)boughtState=JSON.parse(d);}catch{}
  try{const d=localStorage.getItem('fp-custom');if(d)customTasksState=JSON.parse(d);}catch{}
  renderSemana();renderCompras();
}
function saveCustomLocal(){
  try{localStorage.setItem('fp-custom',JSON.stringify(customTasksState));}catch{}
}

// ─── HELPERS ─────────────────────────────────────────────────────
const ts=()=>new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
function ucolor(name){
  const k=Object.entries(LABELS).find(([,v])=>v===name)?.[0];
  return k?COLORS[k]:'#16A34A';
}
function ring(pct,color,size=44){
  const r=(size-7)/2,c=2*Math.PI*r,off=c-(pct/100)*c;
  return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg);display:block">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="3.5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="3.5"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}
function getPct(di){
  const preset=TASKS[di];
  const pd=preset.filter((_,i)=>tasksState[`${di}-${i}`]?.done).length;
  const custom=customTasksState[di]?Object.values(customTasksState[di]):[];
  const cd=custom.filter(t=>t.done).length;
  const total=preset.length+custom.length;
  return total?Math.round((pd+cd)/total*100):0;
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ─── USUARIO ─────────────────────────────────────────────────────
function setUser(n){
  currentUser=n;
  localStorage.setItem('fp-user',n);
  document.getElementById('modal').classList.add('hidden');
  updateChip();
}
function changeUser(){document.getElementById('modal').classList.remove('hidden');}
function updateChip(){
  if(!currentUser)return;
  document.getElementById('uname').textContent=currentUser;
  if(!useFirebase)document.getElementById('cdot').style.background='#F59E0B';
}

// ─── RENDER TABS ──────────────────────────────────────────────────
function renderTabs(){
  document.getElementById('tabs').innerHTML=
    [['semana','📅 Semana'],['menu','🍽️ Menú'],['compras','🛒 Compras'],['tips','💡 Tips']]
    .map(([k,l])=>`<button class="tb${activeTab===k?' on':''}" onclick="showTab('${k}')">${l}</button>`)
    .join('');
}

// ─── RENDER SEMANA ────────────────────────────────────────────────
function renderSemana(){
  const customForDay=customTasksState[activeDay]?Object.entries(customTasksState[activeDay]):[];
  const presetDone=TASKS[activeDay].filter((_,i)=>tasksState[`${activeDay}-${i}`]?.done).length;
  const customDone=customForDay.filter(([,t])=>t.done).length;
  const done=presetDone+customDone;
  const total=TASKS[activeDay].length+customForDay.length;
  const pct=total?Math.round(done/total*100):0;

  // Day grid
  let dp='<div class="dgrid">';
  DAYS.forEach((d,i)=>{
    const p=getPct(i);
    dp+=`<button class="db${activeDay===i?' on':''}" onclick="selDay(${i})">
      <span class="dlabel">${d.slice(0,3)}</span>
      <div class="rw">${ring(p,p===100?'#16A34A':'#D97706')}<span class="rpct">${p}%</span></div>
      <span class="dsub">${i===4?'Finde':i>=5?'Sin Martín':''}</span>
    </button>`;
  });
  dp+='</div>';

  const al=ALERTS[activeDay]?`<div class="alert amber">${ALERTS[activeDay]}</div>`:'';

  const pb=`<div class="pcard">
    <div class="phdr"><span>${DAYS[activeDay]}</span><span>${done}/${total}${pct===100?' 🎉':''}</span></div>
    <div class="ptrack"><div class="pfill${pct===100?' done':''}" style="width:${pct}%"></div></div>
  </div>`;

  // Preset tasks
  let tl='<div class="tasks">';
  TASKS[activeDay].forEach((task,i)=>{
    const k=`${activeDay}-${i}`;
    const info=tasksState[k];
    const isDone=!!info?.done;
    const pc=COLORS[task.p]||'#6B7280';
    const byHtml=isDone&&info?.by
      ?`<div class="doneby" style="color:${ucolor(info.by)}">✓ ${info.by}${info.at?' · '+info.at:''}</div>`:'';
    tl+=`<div class="task${isDone?' done':''}" style="border-left-color:${isDone?'#E5E7EB':pc}" onclick="toggleTask(${activeDay},${i})">
      <div class="cb${isDone?' on':''}"><span class="ck">✓</span></div>
      <div class="tinfo">
        <div class="tt">${task.t}</div>
        ${byHtml}
      </div>
      ${task.r&&!isDone?'<span class="star">★</span>':''}
      <span class="badge" style="background:${BGS[task.p]};color:${pc}">${LABELS[task.p]}</span>
    </div>`;
  });

  // Custom tasks section
  if(customForDay.length>0){
    tl+=`<div class="custom-section-label">Tareas agregadas</div>`;
    customForDay.forEach(([taskId,task])=>{
      const isDone=!!task.done;
      const pc=COLORS[task.assignedTo]||'#6B7280';
      const pinfo=PRIO[task.priority]||PRIO.media;
      const byHtml=isDone&&task.by
        ?`<div class="doneby" style="color:${ucolor(task.by)}">✓ ${task.by}${task.at?' · '+task.at:''}</div>`:'';
      tl+=`<div class="task${isDone?' done':''}" style="border-left-color:${isDone?'#E5E7EB':pc}">
        <div class="cb${isDone?' on':''}" onclick="toggleCustomTask(${activeDay},'${taskId}')"><span class="ck">✓</span></div>
        <div class="tinfo" onclick="toggleCustomTask(${activeDay},'${taskId}')">
          <div class="tt">${task.text}</div>
          <span class="prio-badge" style="background:${pinfo.bg};color:${pinfo.color}">${pinfo.label}</span>
          ${byHtml}
        </div>
        <span class="badge" style="background:${BGS[task.assignedTo]||BGS.T};color:${pc}">${LABELS[task.assignedTo]||'Todos'}</span>
        <button class="del-btn" onclick="deleteCustomTask(${activeDay},'${taskId}')" title="Eliminar tarea">🗑️</button>
      </div>`;
    });
  }

  tl+='</div>';

  // Add task button
  const addBtn=`<button class="add-task-btn" onclick="openAddTask(${activeDay})">
    ＋ Agregar tarea para el ${DAYS[activeDay]}
  </button>`;

  const leg=`<div class="leg"><div class="legt">Referencias</div><div class="legr">
    ${Object.entries(LABELS).map(([k,v])=>`<span class="badge" style="background:${BGS[k]};color:${COLORS[k]}">${v}</span>`).join('')}
    <span style="font-size:12px;font-weight:600;color:#6B7280;display:flex;align-items:center;gap:3px"><span style="color:#EF4444">★</span> Obligatoria</span>
  </div></div>`;

  document.getElementById('sec-semana').innerHTML=dp+al+pb+tl+addBtn+leg;
}

// ─── RENDER MENU ──────────────────────────────────────────────────
function renderMenu(){
  let h=`<div class="alert red">⚠️ ALERGIA: Martín es alérgico al maní — verificar trazas en granola y proteína en polvo</div>`;
  MENU.forEach((m,i)=>{
    h+=`<div class="mcard">
      <div class="mhdr"><span class="mday">${m.d}</span>${i>=4?`<span class="mnote">${i===4?'(Martín se va hoy)':'Sin Martín'}</span>`:''}</div>
      <div class="mbody">${[['🌅 Desayuno',m.des],['☀️ Almuerzo',m.alm],['🌙 Cena',m.cen]].map(([l,f])=>`<div class="mrow"><span class="mlabel">${l}</span><span class="mfood">${f}</span></div>`).join('')}</div>
    </div>`;
  });
  h+=`<p style="font-size:11px;color:#9CA3AF;margin-top:10px;text-align:center">⚠️ = revisar etiquetas por trazas de maní</p>`;
  document.getElementById('sec-menu').innerHTML=h;
}

// ─── RENDER COMPRAS ───────────────────────────────────────────────
function renderCompras(){
  let h=`<div class="alert red">⚠️ ALERGIA MANÍ — Revisar etiquetas de granola y proteína en polvo antes de comprar</div>`;
  COMPRAS.forEach((cat,ci)=>{
    const n=cat.items.filter((_,ii)=>boughtState[`${ci}-${ii}`]?.done).length;
    let items='';
    cat.items.forEach((item,ii)=>{
      const k=`${ci}-${ii}`,info=boughtState[k],isB=!!info?.done,isW=item.startsWith('⚠️');
      const byHtml=isB&&info?.by?`<div class="sdoneby" style="color:${ucolor(info.by)}">✓ ${info.by}${info.at?' · '+info.at:''}</div>`:'';
      items+=`<div class="sitem${isW?' warn':''}${isB?' got':''}" onclick="toggleBought('${k}')">
        <div class="scb${isB?' on':''}"><span style="color:#fff;font-size:11px;font-weight:800;display:${isB?'block':'none'}">✓</span></div>
        <div class="sinfo"><div class="sitxt">${item}</div>${byHtml}</div>
      </div>`;
    });
    h+=`<div class="scat">
      <div class="scath"><span class="scatt">${cat.cat}</span><span class="scatn">${n}/${cat.items.length}</span></div>
      <div class="sitems">${items}</div>
    </div>`;
  });
  h+=`<button class="rbtn" onclick="resetCompras()">🔄 Limpiar lista de compras</button>`;
  document.getElementById('sec-compras').innerHTML=h;
}

// ─── RENDER TIPS ──────────────────────────────────────────────────
function renderTips(){
  document.getElementById('sec-tips').innerHTML=`<div class="tiplist">${
    TIPS.map(t=>`<div class="tip" style="border-left-color:${t.c}">
      <div class="tiph"><span class="tipi">${t.i}</span><span class="tipt">${t.t}</span></div>
      <p class="tipd">${t.d}</p>
    </div>`).join('')
  }</div>`;
}

// ─── ACCIONES TAREAS ─────────────────────────────────────────────
function showTab(t){
  activeTab=t;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('sec-'+t).classList.add('on');
  renderTabs();
  if(t==='semana')renderSemana();
  else if(t==='menu')renderMenu();
  else if(t==='compras')renderCompras();
  else if(t==='tips')renderTips();
}
function selDay(d){activeDay=d;renderSemana();}

async function toggleTask(d,i){
  if(!currentUser){changeUser();return;}
  const k=`${d}-${i}`,isDone=!!tasksState[k]?.done;
  if(useFirebase){
    isDone?await db.ref(`planner/tasks/${k}`).remove()
           :await db.ref(`planner/tasks/${k}`).set({done:true,by:currentUser,at:ts()});
  }else{
    if(isDone)delete tasksState[k];
    else tasksState[k]={done:true,by:currentUser,at:ts()};
    localStorage.setItem('fp-tasks',JSON.stringify(tasksState));
    renderSemana();
  }
}

async function toggleCustomTask(day,taskId){
  if(!currentUser){changeUser();return;}
  const task=customTasksState[day]?.[taskId];
  if(!task)return;
  const isDone=!!task.done;
  const update=isDone?{done:false,by:null,at:null}:{done:true,by:currentUser,at:ts()};
  if(useFirebase){
    await db.ref(`planner/customTasks/${day}/${taskId}`).update(update);
  }else{
    Object.assign(customTasksState[day][taskId],update);
    saveCustomLocal();
    renderSemana();
  }
}

async function deleteCustomTask(day,taskId){
  if(!confirm('¿Eliminar esta tarea?'))return;
  if(useFirebase){
    await db.ref(`planner/customTasks/${day}/${taskId}`).remove();
  }else{
    if(customTasksState[day])delete customTasksState[day][taskId];
    saveCustomLocal();
    renderSemana();
  }
}

async function toggleBought(k){
  if(!currentUser){changeUser();return;}
  const isB=!!boughtState[k]?.done;
  if(useFirebase){
    isB?await db.ref(`planner/bought/${k}`).remove()
       :await db.ref(`planner/bought/${k}`).set({done:true,by:currentUser,at:ts()});
  }else{
    if(isB)delete boughtState[k];
    else boughtState[k]={done:true,by:currentUser,at:ts()};
    localStorage.setItem('fp-bought',JSON.stringify(boughtState));
    renderCompras();
  }
}

function resetCompras(){
  if(!confirm('¿Limpiar toda la lista de compras?'))return;
  useFirebase?db.ref('planner/bought').remove():(boughtState={},localStorage.setItem('fp-bought','{}'),renderCompras());
}

// ─── MODAL NUEVA TAREA ───────────────────────────────────────────
function openAddTask(day){
  if(!currentUser){changeUser();return;}
  addingForDay=day;
  newPrio='media';
  newAssign='T';
  document.getElementById('tm-text').value='';
  document.getElementById('tm-day-label').textContent='Para el '+DAYS[day];
  // Reset selectors
  document.querySelectorAll('#prio-row .sel-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.v==='media');
  });
  document.querySelectorAll('#assign-row .sel-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.v==='T');
  });
  document.getElementById('task-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('tm-text').focus(),100);
}

function closeTaskModal(){
  document.getElementById('task-modal').classList.add('hidden');
}

function selPrio(p){
  newPrio=p;
  document.querySelectorAll('#prio-row .sel-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.v===p);
  });
}

function selAssign(u){
  newAssign=u;
  document.querySelectorAll('#assign-row .sel-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.v===u);
  });
}

async function saveCustomTask(){
  const text=document.getElementById('tm-text').value.trim();
  if(!text){document.getElementById('tm-text').focus();return;}
  const taskId=genId();
  const newTask={
    text,
    priority:newPrio,
    assignedTo:newAssign,
    createdBy:currentUser,
    createdAt:ts(),
    done:false,
    by:null,
    at:null
  };
  closeTaskModal();
  if(useFirebase){
    await db.ref(`planner/customTasks/${addingForDay}/${taskId}`).set(newTask);
  }else{
    if(!customTasksState[addingForDay])customTasksState[addingForDay]={};
    customTasksState[addingForDay][taskId]=newTask;
    saveCustomLocal();
    renderSemana();
  }
}

// Cerrar modal tarea con Escape
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeTaskModal();
  if(e.key==='Enter'&&!document.getElementById('task-modal').classList.contains('hidden'))saveCustomTask();
});

// ─── INIT ─────────────────────────────────────────────────────────
if(currentUser)document.getElementById('modal').classList.add('hidden');
updateChip();
renderTabs();
renderMenu();
renderTips();
initFirebase();
if(!useFirebase)fallbackLocal();
</script>
</body>
</html>
